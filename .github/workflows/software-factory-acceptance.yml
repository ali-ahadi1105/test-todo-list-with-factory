name: software-factory acceptance

# Publishes the two commit statuses the OpenHands software-factory watchdog
# requires before it may merge a pull request:
#   software-factory/tests  - the repository test suite passed on this exact head
#   software-factory/review - an approving native review exists on this exact head
#
# The watchdog fails closed: a missing, pending or failed status means no merge.
# This workflow is what makes the delivery loop close without a human merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write
  pull-requests: read

concurrency:
  group: software-factory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Publish software-factory/tests status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = process.env.TEST_STATUS || 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request?.head.sha || context.sha,
              state: status,
              context: 'software-factory/tests',
              description: 'Test suite result on the exact head',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
        env:
          TEST_STATUS: ${{ job.status == 'success' && 'success' || 'failure' }}

  review:
    name: review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Look for an approving review on the exact head
        id: review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number }
            );
            const approved = reviews.some(
              (r) => r.commit_id === pr.head.sha && r.state === 'APPROVED'
            );
            const botApproved = reviews.some(
              (r) => r.commit_id === pr.head.sha && r.state === 'COMMENTED' && /APPROVED\s*$/.test(r.body || '')
            );
            core.setOutput('approved', String(approved || botApproved));

      - name: Publish software-factory/review status
        uses: actions/github-script@v7
        with:
          script: |
            const approved = '${{ steps.review.outputs.approved }}' === 'true';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: approved ? 'success' : 'pending',
              context: 'software-factory/review',
              description: approved ? 'Approved review on the exact head' : 'Waiting for an approving review',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${context.payload.pull_request.number}`,
            });
